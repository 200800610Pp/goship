<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">GoShip 上线全景图：四样东西，拼出一个网店</text>

  <!-- 第一行：三件要买/注册的东西 -->
  <g>
    <rect x="30" y="70" width="270" height="86" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="165" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">① 域名（网址）</text>
    <text x="165" y="126" text-anchor="middle" font-size="14" fill="#334155">例如 goship.dev</text>
    <text x="165" y="145" text-anchor="middle" font-size="13" fill="#64748b">约 ¥60–80 / 年</text>

    <rect x="335" y="70" width="270" height="86" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="470" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">② 服务器（放网站的电脑）</text>
    <text x="470" y="126" text-anchor="middle" font-size="14" fill="#334155">轻量服务器 2核2G · 香港节点</text>
    <text x="470" y="145" text-anchor="middle" font-size="13" fill="#64748b">约 ¥50/月（新用户常有活动价）</text>

    <rect x="640" y="70" width="270" height="86" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="775" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">③ 收款平台（收美元的收银台）</text>
    <text x="775" y="126" text-anchor="middle" font-size="14" fill="#334155">Waffo Pancake</text>
    <text x="775" y="145" text-anchor="middle" font-size="13" fill="#64748b">个人可注册，卖出才抽成</text>
  </g>

  <!-- 箭头：三件 → 汇聚 -->
  <path d="M165 156 L165 185 L470 185 L470 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M470 156 L470 205" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M775 156 L775 185 L470 185" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- 第二行：产品 + 上线 -->
  <g>
    <rect x="200" y="208" width="540" height="92" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="470" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">④ 把 GoShip 代码放进服务器（本教程第 3–4 步）</text>
    <text x="470" y="262" text-anchor="middle" font-size="14" fill="#78350f">网站、登录注册、后台、收款接口 —— 全部已经做好</text>
    <text x="470" y="284" text-anchor="middle" font-size="14" fill="#78350f">你只需要：改店名、改文案、填上收款密钥</text>
  </g>

  <!-- 箭头 -->
  <path d="M470 300 L470 330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 第三行：上线 + 卖出 -->
  <g>
    <rect x="200" y="334" width="540" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="470" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">✅ 你的网店上线：https://goship.dev</text>
    <text x="470" y="381" text-anchor="middle" font-size="13" fill="#166534">带 HTTPS 安全锁 · 全天候在线 · 开机自启</text>
  </g>

  <!-- 箭头分叉 -->
  <path d="M470 392 L470 418" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- 第四行：海外用户 -->
  <g>
    <rect x="130" y="422" width="310" height="46" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="285" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">🌏 海外用户下单（美元结算）</text>

    <rect x="500" y="422" width="310" height="46" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="655" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">💰 你提现到国内银行卡</text>
  </g>
  <path d="M440 445 L500 445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
</svg>
