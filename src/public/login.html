<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · GoShip 出海快启</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="auth">

<header class="site-nav">
  <div class="container nav-inner">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="logo" width="28" height="28">GoShip<span class="brand-zh">出海快启</span></a>
    <nav class="nav-links"><a class="btn btn-sm btn-outline" href="/register">注册</a></nav>
  </div>
</header>

<main class="container">
  <div class="form-card">
    <h1>欢迎回来 👋</h1>
    <p class="sub">登录你的 GoShip 账号</p>
    <div class="form-error" id="form-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">邮箱</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <p class="form-foot">还没有账号？<a href="/register">免费注册</a><br>
    <span class="muted small">演示账号：demo@goship.dev / demo123456</span></p>
  </div>
</main>

<div id="toast"></div>
<script src="/assets/app.js?v=5"></script>
</body>
</html>
